<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- user-scalable=no stops a two-thumb aim gesture from pinch-zooming the page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Codex of Duty — Three.js FPS Game</title>
  <style>
    * { margin: 0; padding: 0; overflow: hidden; }
    html, body { overscroll-behavior: none; background: #000; }
    #game { width: 100vw; height: 100dvh; }
    #loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Courier New', monospace; font-size: 24px; color: #fff;
      text-shadow: 0 0 10px #00ff00;
    }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }
  </style>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5HKPB8C162"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5HKPB8C162');
  </script>
</head>
<body>
  <div id="loading">LOADING ASSETS...</div>
  <div id="game"></div>
  <div id="hud"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
